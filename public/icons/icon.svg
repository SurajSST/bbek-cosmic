<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Rounded Base -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  
  <!-- Glowing Inner Container -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Geometric Planetary Ring / Orbit -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="6" stroke-dasharray="16 12" />
  <circle cx="370" cy="142" r="14" fill="url(#accentGrad)" />
  
  <!-- Brand Letter 'C' -->
  <path d="M 290 155 C 220 155 165 200 165 256 C 165 312 220 357 290 357 C 330 357 360 342 375 320 L 332 290 C 322 303 306 312 288 312 C 248 312 216 287 216 256 C 216 225 248 200 288 200 C 306 200 322 209 332 222 L 375 192 C 360 170 330 155 290 155 Z" fill="#ffffff" />
</svg>
